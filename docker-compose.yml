services:
  db:
    image: postgres:15-alpine
    container_name: thedcminute-db
    restart: always
    environment:
      POSTGRES_USER: thedcminute
      POSTGRES_PASSWORD: thedcminute_pass_123
      POSTGRES_DB: thedcminute
    ports:
      - '127.0.0.1:5438:5432'
    volumes:
      - thedcminute_db_data:/var/lib/postgresql/data

volumes:
  thedcminute_db_data:
