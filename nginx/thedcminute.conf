# ── Rate Limiting ──────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=thedcminute_api:10m rate=10r/s;

# ── HTTP Server (Supports Cloudflare Flexible + Let's Encrypt) ──
server {
    listen 80;
    listen [::]:80;
    server_name thedcminute.com www.thedcminute.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to PM2 port 3002
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    location /media/ {
        alias /var/www/thedcminute/public/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        expires    365d;
        add_header Cache-Control "public, immutable";
    }
}
